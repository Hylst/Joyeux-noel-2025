    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        .font-christmas { font-family: 'Mountains of Christmas', cursive; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star { animation: twinkle var(--duration) infinite ease-in-out; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float-anim { animation: float 3s infinite ease-in-out; }

        @keyframes firefly-move {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.8; }
            50% { transform: translate(var(--tx), var(--ty)); opacity: 0.4; }
            80% { opacity: 0.8; }
            100% { transform: translate(0, 0); opacity: 0; }
        }

        .firefly {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #FCD34D;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(252, 211, 77, 0.4);
            animation: firefly-move var(--duration) infinite ease-in-out;
            animation-delay: var(--delay);
            opacity: 0;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gold-glow {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3);
        }
    </style>
